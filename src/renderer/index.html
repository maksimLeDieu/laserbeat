<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' file:; media-src file: blob:">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musique ML</title>
<style>
/* ===== Musique ML — interface « pro » =====
   Organisation façon lecteur de musique moderne : bibliothèque à gauche, contenu au centre,
   « En cours de lecture » à droite, lecteur fixé en bas. Identité Musique ML : noir profond, accent violet.
   Police intégrée (fonctionne hors ligne) : DM Sans. */
@font-face{font-family:"DM Sans";src:url(fonts/dm-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"DM Sans";src:url(fonts/dm-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"DM Sans";src:url(fonts/dm-sans-latin-700-normal.woff2) format("woff2");font-weight:600 900;font-display:block}
@property --hh{syntax:'<number>';inherits:true;initial-value:265}
:root{
 --bg:#000;--panel:#121216;--panel2:#1c1c22;--panel3:#26262e;
 --hover:rgba(255,255,255,.07);--hover2:rgba(255,255,255,.12);--line:#2a2a33;
 --tx:#fff;--tx2:#dcdce4;--mut:#a7a7b3;--ac:#8b5cf6;--ac2:#a78bfa;--red:#ff6b8f;
 --grad:linear-gradient(135deg,#7c4dff 0%,#b43cf0 52%,#ff4d8d 100%);
 --font:"DM Sans","Segoe UI",system-ui,sans-serif;
 --lw:300px;--rw:320px;
 color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--tx);background:var(--bg);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,[data-act]:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:3px solid transparent;background-clip:padding-box;border-radius:12px}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

.app{height:100vh;display:grid;grid-template-rows:64px minmax(0,1fr) 80px;gap:8px;padding:0 8px 8px}
.app.mini{--lw:72px}

/* ---- barre du haut ---- */
.top{display:flex;align-items:center;gap:8px;min-width:0}
.brand{color:inherit;text-align:left;cursor:pointer;border-radius:10px;transition:opacity .15s}
.brand:hover .mark{box-shadow:0 0 0 3px rgba(139,92,246,.45)}
.brand.on .mark{box-shadow:0 0 0 3px var(--ac2)}
.brand{width:var(--lw);flex:none;display:flex;align-items:center;gap:10px;padding-left:14px;font-weight:800;font-size:19px;letter-spacing:-.03em;overflow:hidden}
.app.mini .brand span{display:none}
.mark{width:32px;height:32px;border-radius:8px;flex:none;display:block}
.logo{width:32px;height:32px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:18px;height:18px}
.hbtn{width:48px;height:48px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--mut);flex:none;transition:transform .15s,color .15s,background .15s}
.hbtn:hover{color:#fff;transform:scale(1.04);background:var(--panel3)}
.hbtn.on{color:#fff}
.hbtn svg{width:24px;height:24px}
.search{flex:0 1 380px;min-width:180px;height:48px;border-radius:24px;background:var(--panel2);display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;border:2px solid transparent;cursor:text;transition:background .15s,border-color .15s}
.search:hover{background:var(--panel3);border-color:var(--panel3)}
.search:focus-within{border-color:#fff;background:var(--panel3)}
.search svg{color:var(--mut);width:22px;height:22px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%;font-size:15px}
.search input::placeholder{color:var(--mut)}
.search kbd{font:12px var(--font);color:var(--mut);border:1px solid #3a3a44;padding:2px 7px;border-radius:5px;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:16px;background:var(--panel2);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;flex:none;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.status i{width:8px;height:8px;border-radius:50%;background:#55555f;flex:none}
.status.live{color:#fff}
.status.live i{background:var(--ac2);box-shadow:0 0 0 3px rgba(139,92,246,.28)}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--mut);flex:none;transition:color .15s,transform .15s,background .15s}
.ibtn:hover{color:#fff}
.ibtn.on{color:var(--ac2)}
.top .ibtn{width:40px;height:40px;background:var(--panel2)}
.top .ibtn:hover{background:var(--panel3);transform:scale(1.04)}

/* ---- zones ---- */
.body{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);gap:8px;min-height:0}
.app.rp .body{grid-template-columns:var(--lw) minmax(0,1fr) var(--rw)}
.app:not(.rp) .rpanel{display:none}
.panel{background:var(--panel);border-radius:10px;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}

/* ---- bibliothèque (gauche) ---- */
.side .sh{display:flex;align-items:center;gap:4px;padding:12px 10px 8px 16px;flex:none}
.libt{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;color:var(--mut);flex:1;min-width:0;padding:6px 0;transition:color .15s;white-space:nowrap}
.libt:hover,.libt.on{color:#fff}
.libt svg{width:24px;height:24px}
.app.mini .side .sh{justify-content:center;padding:14px 0 8px}
.app.mini .libt,.app.mini #bAdd,.app.mini .chips,.app.mini .pli .pm,.app.mini .pli .spk,.app.mini .vline,.app.mini #upd .sub,.app.mini #upd .pill span{display:none}
.chips{display:flex;gap:8px;padding:4px 16px 10px;flex-wrap:wrap;flex:none}
.chip{height:32px;padding:0 14px;border-radius:16px;background:var(--panel2);font-size:13px;font-weight:500;display:flex;align-items:center;white-space:nowrap;transition:background .15s}
.chip:hover{background:var(--panel3)}
.chip.on{background:#fff;color:#000}
#sideList{flex:1;overflow:auto;padding:0 8px 8px}
.pli{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:6px;transition:background .12s}
.pli:hover{background:var(--hover)}
.pli.on{background:var(--hover2)}
.pli .pa{width:48px;height:48px;border-radius:4px;flex:none;display:grid;place-items:center;color:#fff}
.pli .pm{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.pli b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli.playing b{color:var(--ac2)}
.pli small{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli .spk{display:none;color:var(--ac2)}
.pli.playing .spk{display:block}
.pli .spk svg{width:16px;height:16px}
.sfoot{flex:none;padding:10px 16px 14px;border-top:1px solid var(--line)}
.app.mini .sfoot{padding:10px 8px}
#upd{margin-bottom:10px}
#upd .pill{width:100%;justify-content:center}
#upd .sub{font-size:12px;margin:8px 2px 0}
.vline{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:12px}

/* ---- contenu (centre) ---- */
#main{flex:1;overflow:auto;position:relative;container-type:inline-size;display:flex;flex-direction:column}
#view{flex:1 0 auto;display:flex;flex-direction:column}
#view>.pv,#view>.home{flex:1 0 auto}
.mhead{position:sticky;top:0;z-index:5;height:64px;margin-bottom:-64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--hc,#2a1640);opacity:0;pointer-events:none;transition:opacity .2s}
.mhead.show{opacity:1;pointer-events:auto}
#ttl{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{background:linear-gradient(180deg,var(--h1,#4a2a7a) 0,var(--h2,#1e1430) 340px,var(--panel) 640px)}
.ph{padding:76px 24px 24px;display:flex;gap:24px;align-items:flex-end}
.ph .art{width:clamp(150px,22cqw,232px);aspect-ratio:1;border-radius:6px;flex:none;box-shadow:0 8px 40px rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.ph .art svg{width:36%;height:36%;stroke-width:1.3;opacity:.92}
.ph .art svg.f{stroke:none}
.ph .pt{min-width:0}
.ph small{font-size:13px;font-weight:600}
.ph h1{font-size:clamp(36px,8.5cqw,84px);font-weight:900;letter-spacing:-.045em;line-height:1;margin:10px 0 16px;overflow-wrap:anywhere}
.ph p{color:rgba(255,255,255,.8);font-size:14px;line-height:1.5}
.ph p b{color:#fff}
.pacts{display:flex;align-items:center;gap:22px;padding:8px 24px 24px;min-height:64px}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .12s,background .12s}
.bigplay:hover{transform:scale(1.05);background:var(--ac2)}
.bigplay svg{width:24px;height:24px}
.mhead .bigplay{width:44px;height:44px}
.mhead .bigplay svg{width:20px;height:20px}
.gbtn{color:var(--mut);transition:color .15s,transform .15s;display:grid;place-items:center}
.gbtn svg{width:30px;height:30px}
.gbtn:hover{color:#fff;transform:scale(1.05)}
.pill{height:40px;padding:0 18px;border-radius:20px;border:1px solid #6b6b75;font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;transition:transform .12s,border-color .12s,background .12s}
.pill:hover{border-color:#fff;transform:scale(1.03)}
.pill.pri{background:var(--ac);border-color:var(--ac);color:#000}
.pill.pri:hover{background:var(--ac2);border-color:var(--ac2)}
.pill:disabled{opacity:.6;transform:none}
.pill svg{width:18px;height:18px}
.sub{color:var(--mut)}
.empty{margin:8px 0;padding:36px 28px;text-align:center;color:var(--mut);border-radius:8px;background:var(--hover);line-height:1.55}

/* liste de morceaux */
.tlist{padding:0 24px 32px}
.trow{display:grid;grid-template-columns:32px minmax(0,1.4fr) minmax(0,.8fr) 84px 72px 52px;align-items:center;gap:14px;height:56px;padding:0 14px;border-radius:6px;cursor:pointer;color:var(--mut)}
.trow:hover{background:var(--hover)}
.trow.cur{background:rgba(139,92,246,.10)}
.trow.cur:hover{background:rgba(139,92,246,.16)}
.trow .n{display:flex;justify-content:flex-end;align-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.trow .pi{display:none;color:#fff}
.trow .pi svg{width:16px;height:16px}
.eqs{display:none;gap:2px;height:14px;align-items:flex-end}
.eqs i{width:3px;height:40%;border-radius:1px;background:var(--ac2);animation:eqs .9s infinite ease-in-out;animation-play-state:paused}
.eqs i:nth-child(2){animation-delay:.25s}.eqs i:nth-child(3){animation-delay:.5s}
body.playing .eqs i{animation-play-state:running}
@keyframes eqs{0%,100%{height:30%}50%{height:100%}}
.trow.cur .num{display:none}
.trow.cur .eqs{display:inline-flex}
.trow:not(.thead):hover .num,.trow:not(.thead):hover .eqs{display:none}
.trow:not(.thead):hover .pi{display:grid}
.trow .th{display:flex;gap:12px;align-items:center;min-width:0}
.trow .th i{width:40px;height:40px;border-radius:4px;flex:none}
.trow .tt{min-width:0;display:flex;flex-direction:column;gap:2px}
.trow .tn{display:block;color:#fff;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.cur .tn{color:var(--ac2)}
.trow .sa{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow:hover .sa,.trow:hover .c-pl{color:var(--tx2)}
.trow .m{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .dur{text-align:right;display:flex;justify-content:flex-end}
.trow .ta{display:flex;justify-content:flex-end;gap:2px}
.trow .star,.trow .del{opacity:0}
.trow:hover .star,.trow:hover .del,.trow .star.on,.trow .del:focus-visible{opacity:1}
.star.on{color:var(--ac2)}
.star.on svg{fill:var(--ac2)}
.trow .del:hover{color:var(--red)}
.trow .ibtn svg{width:18px;height:18px}
.trow[draggable="true"]{position:relative}
.trow .grip{position:absolute;left:-2px;top:50%;margin-top:-9px;color:var(--mut);opacity:0;cursor:grab}
.trow .grip svg{width:16px;height:18px}
.trow[draggable="true"]:hover .grip{opacity:.8}
.trow.dragging{opacity:.35}
.trow.drop-before{box-shadow:inset 0 3px 0 var(--ac2)}
.trow.drop-after{box-shadow:inset 0 -3px 0 var(--ac2)}
.thead{height:36px;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:8px;cursor:default;font-size:13px}
.thead:hover{background:none}
.thead svg{width:16px;height:16px}
@container (max-width:700px){
 .trow{grid-template-columns:32px minmax(0,1fr) 72px 52px}
 .trow .c-pl,.trow .c-bpm{display:none}
 .ph{gap:18px}
}

/* compte */
.acct[hidden]{display:none}
.acct{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 10px;border-radius:16px;background:var(--panel2);font-size:13px;font-weight:700;color:#fff;margin-left:auto;flex:none;max-width:180px}
.acct svg{width:16px;height:16px;color:var(--ac2)}
.acct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct:hover{background:var(--panel3)}
.acct:not([hidden])~.status{margin-left:0}
.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.form input[type=text],.form input[type=password]{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:#fff;padding:0 12px;font-size:15px;user-select:text}
.form input:focus{outline:2px solid var(--ac2);outline-offset:1px;border-color:transparent}
.form .chk{flex-direction:row;align-items:center;gap:10px;color:var(--tx2);font-weight:500}
.form .chk input{width:18px;height:18px;accent-color:var(--ac)}
.fhint{margin:0;color:var(--mut);font-size:12.5px;line-height:1.5}
.ferr{color:var(--red);font-size:13px;min-height:1.3em;margin:0}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkb{color:var(--ac2);font-weight:700;font-size:13px}
.linkb:hover{text-decoration:underline}
.pill.danger{border-color:rgba(255,107,143,.5);color:var(--red)}

/* paramètres */
.set{padding:24px 24px 40px;max-width:820px;display:flex;flex-direction:column;gap:28px;background:linear-gradient(180deg,hsl(262 40% 20%) 0,var(--panel) 260px);min-height:100%}
.set-head{display:flex;align-items:center;gap:16px;margin-top:20px}
.set-head .mark{width:56px;height:56px;border-radius:14px}
.set-head h1{font-size:32px;font-weight:800;letter-spacing:-.03em}
.set-head small{color:var(--mut);font-size:14px}
.set-sec h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:0 4px 10px}
.set-card{background:var(--panel2);border-radius:12px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:16px;padding:16px 18px;min-height:72px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-ic{width:40px;height:40px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;color:var(--ac2);flex:none}
.set-txt{flex:1;min-width:0}
.set-txt b{display:block;font-size:15px;font-weight:700}
.set-txt small{display:block;color:var(--mut);font-size:13px;margin-top:3px;line-height:1.45}
.set-row .pill{height:36px;padding:0 16px;font-size:13px}
.soon{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac2);background:rgba(139,92,246,.15);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.sw{width:46px;height:26px;border-radius:13px;background:#3a3a44;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,.7,0,1)}
.sw[aria-checked="true"]{background:var(--ac)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* informations légales */
.lg{padding:24px 24px 48px;max-width:860px;min-height:100%;background:linear-gradient(180deg,hsl(262 30% 17%) 0,var(--panel) 220px)}
.lg-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 26px}
.lg h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:18px}
.lg .maj{color:var(--mut);font-size:13px;margin-top:6px}
.lg h4{font-size:16px;font-weight:700;margin:26px 0 8px;color:#fff}
.lg p,.lg li{color:var(--tx2);line-height:1.7;font-size:14.5px;max-width:72ch;user-select:text}
.lg p+p{margin-top:10px}
.lg ul{margin:8px 0 0 20px;display:flex;flex-direction:column;gap:6px}

/* accueil */
.home{padding:24px 24px 32px;background:linear-gradient(180deg,hsl(var(--hh) 42% 24%) 0,var(--panel) 330px);transition:--hh .7s}
.home h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:20px 0 22px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
@container (max-width:760px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qt{position:relative;display:flex;align-items:center;height:64px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s;min-width:0}
.qt:hover{background:rgba(255,255,255,.17)}
.qt>i{width:64px;height:64px;flex:none;display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.qt>i svg{width:24px;height:24px}
.qt>span{padding:0 60px 0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fplay{position:absolute;width:48px;height:48px;border-radius:50%;background:var(--ac);color:#000;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.4);opacity:0;transition:opacity .2s,transform .2s,background .12s}
.fplay:hover{background:var(--ac2);transform:scale(1.05)!important}
.fplay svg{width:22px;height:22px}
.qt .fplay{right:10px;width:40px;height:40px}
.qt .fplay svg{width:18px;height:18px}
.qt:hover .fplay{opacity:1}
.feat{display:flex;gap:24px;align-items:center;margin-top:36px;padding:22px;border-radius:10px;overflow:hidden;position:relative}
.feat .art{width:156px;height:156px;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.feat .art svg{width:56px;height:56px;stroke-width:1.3}
.feat small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.feat h2{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1.05;margin:6px 0 8px}
.feat p{color:rgba(255,255,255,.78);margin-bottom:16px}
.feat .acts{display:flex;gap:10px;flex-wrap:wrap}
.sec{margin-top:38px}
.sec h2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.sec h2 a{font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.sec h2 a:hover{color:#fff;text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin:0 -12px}
.cd{padding:12px;border-radius:8px;cursor:pointer;transition:background .2s;min-width:0}
.cd:hover{background:var(--panel2)}
.cd .ca{position:relative;aspect-ratio:1;border-radius:6px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.cd .ca>svg{width:34%;height:34%;stroke-width:1.3;opacity:.92}
.cd .ca>svg.f{stroke:none}
.cd .fplay{right:8px;bottom:8px;transform:translateY(8px)}
.cd:hover .fplay{opacity:1;transform:none}
.cd b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.cd small{color:var(--mut);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- en cours de lecture (droite) ---- */
.rh{display:flex;align-items:center;gap:8px;padding:16px 12px 12px 16px;flex:none}
.rh b{flex:1;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rp{flex:1;overflow:auto;padding:0 16px 16px}
.rp-art{width:100%;aspect-ratio:1;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.rp-art svg{width:34%;height:34%;stroke-width:1.2;opacity:.9}
.rp-t{display:flex;align-items:center;gap:8px;margin-top:16px}
.rp-t>div{flex:1;min-width:0}
.rp-t h2{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-t span{color:var(--mut);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-card{margin-top:18px;background:var(--panel2);border-radius:8px;padding:14px 12px 10px}
.rp-card h4{font-size:15px;font-weight:700;margin:0 4px 8px}
.rp-card h4 small{color:var(--mut);font-weight:500}
.qi{display:flex;gap:12px;align-items:center;padding:6px 4px;border-radius:6px;width:100%}
.qi:hover{background:var(--hover)}
.qi i{width:40px;height:40px;border-radius:4px;flex:none}
.qi span{min-width:0}
.qi b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi small{color:var(--mut);font-size:13px}
.rp-card p{color:var(--mut);margin:0 4px 6px;font-size:13px}
.rp-card dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 4px 6px;font-size:13px}
.rp-card dt{color:var(--mut)}
.rp-card dd{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 12px;color:var(--mut)}
.rp-empty>svg{width:44px;height:44px;stroke-width:1.4}
.rp-empty b{color:#fff;font-size:17px}
.rp-empty .pill{margin-top:8px}

/* ---- lecteur (bas) ---- */
.player{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,1.35fr) minmax(0,1fr);align-items:center;gap:16px;padding:0 8px}
.np{display:flex;align-items:center;gap:14px;min-width:0;border-radius:8px;padding:4px 6px;margin:-4px -6px;transition:background .15s}
.player.has-track{cursor:pointer}
.player.has-track .np:hover{background:var(--hover)}
.player.has-track .np:hover .meta b{text-decoration:underline}
.player button,.player input,.player .bar{cursor:pointer}
.thumb{width:56px;height:56px;border-radius:4px;background:var(--panel2);flex:none}
.meta{min-width:0}
.meta b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;color:var(--mut);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ctrls{display:flex;align-items:center;gap:18px}
.ctrls .ibtn{position:relative}
.ctrls .ibtn.on::after{content:"";position:absolute;bottom:-1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac2)}
.pp{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;transition:transform .12s}
.pp:hover{transform:scale(1.07)}
.pp svg{width:16px;height:16px}
.rep1::before{content:"1";position:absolute;right:2px;top:1px;font-size:9px;font-weight:800}
.prog{display:flex;align-items:center;gap:8px;width:100%}
.tm{font-size:12px;color:var(--mut);min-width:40px;font-variant-numeric:tabular-nums}
#tmC{text-align:right}
.bar{flex:1;height:4px;border-radius:2px;background:#4d4d57;position:relative;cursor:pointer}
.bar::before{content:"";position:absolute;inset:-7px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:2px}
.bar:hover i{background:var(--ac2)}
.bar i::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.bar:hover i::after{opacity:1}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.vol{display:flex;align-items:center;gap:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:2px;background:linear-gradient(to right,#fff var(--v,80%),#4d4d57 var(--v,80%));outline:0;cursor:pointer}
input[type=range]:hover{background:linear-gradient(to right,var(--ac2) var(--v,80%),#4d4d57 var(--v,80%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 2px 4px rgba(0,0,0,.5)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}

/* ---- plein écran ---- */
/* ---- mode écran (plein écran) : pour un écran ou une télé visible des clients ---- */
#fs{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;color:#fff;background:#07060a;overflow:hidden}
#fs.show{display:flex}
#fs.pre{opacity:0}
#fs.idle{cursor:none}
.fs-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.fs-blob{position:absolute;inset:-25%;background-size:cover;background-position:center;filter:blur(90px) saturate(1.5) brightness(.5);animation:fsdrift 26s ease-in-out infinite alternate}
.fs-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 40%,transparent 0,rgba(0,0,0,.35) 60%,rgba(0,0,0,.7) 100%)}
@keyframes fsdrift{0%{transform:scale(1.05) translate(0,0) rotate(0)}50%{transform:scale(1.2) translate(3%,-2%) rotate(4deg)}100%{transform:scale(1.12) translate(-3%,2%) rotate(-3deg)}}
#fs>*:not(.fs-bg){position:relative;z-index:1}
.fs-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 32px 0;transition:opacity .5s}
.fs-down{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}
.fs-down:hover{background:rgba(255,255,255,.18)}
.fs-down svg{width:24px;height:24px}
.fs-src{text-align:center;line-height:1.25}
.fs-src small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600}
.fs-src b{font-size:15px;font-weight:700}
.fs-top .mark{justify-self:end;width:36px;height:36px;border-radius:9px;opacity:.9}
.fs-main{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,560px);align-items:center;justify-content:center;gap:clamp(32px,6vw,96px);padding:2vh 6vw}
.fs-art-wrap{transition:transform .6s cubic-bezier(.32,.72,0,1)}
#fs.paused .fs-art-wrap{transform:scale(.9)}
#fs .big{width:min(54vh,42vw);aspect-ratio:1;border-radius:12px;box-shadow:0 60px 120px -40px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.06)}
.fs-info{min-width:0;display:flex;flex-direction:column;gap:10px}
.fs-state{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ac2)}
#fs .eq{height:14px;gap:2px}
#fs .eq i{width:3px;background:var(--ac2)}
#fs h2{font-size:clamp(38px,5.4vw,92px);font-weight:900;letter-spacing:-.045em;line-height:1;overflow-wrap:anywhere;text-wrap:balance}
#fs p{font-size:clamp(16px,1.5vw,22px);color:rgba(255,255,255,.72)}
.fs-prog{display:grid;grid-template-columns:1fr;gap:8px;margin-top:22px}
#fs .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
#fs .bar i{background:#fff;border-radius:3px}
#fs .bar:hover i{background:var(--ac2)}
.fs-times{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.fs-ctl{display:flex;align-items:center;justify-content:space-between;max-width:420px;margin-top:6px;transition:opacity .5s}
#fs .fs-ctl .ibtn{position:relative;color:rgba(255,255,255,.85);width:46px;height:46px}
#fs .fs-ctl .ibtn:hover{color:#fff;transform:scale(1.06)}
#fs .fs-ctl .ibtn svg{width:24px;height:24px}
#fs .fs-ctl .ibtn.on{color:var(--ac2)}
#fs .fs-ctl #fPrev svg,#fs .fs-ctl #fNext svg{width:30px;height:30px}
#fs .pp{width:72px;height:72px;box-shadow:0 14px 34px -10px rgba(0,0,0,.6)}
#fs .pp svg{width:28px;height:28px}
.fs-foot{display:flex;justify-content:flex-end;padding:0 32px 26px;transition:opacity .5s}
.fs-next{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:12px;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);font-size:14px;color:rgba(255,255,255,.65);min-width:0;max-width:340px}
.fs-next:empty{display:none}
.fs-next b{display:block;color:#fff;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-next i{width:46px;height:46px;border-radius:7px;flex:none}
.fs-next span{min-width:0}
#fs.idle .fs-top,#fs.idle .fs-ctl,#fs.idle .fs-foot{opacity:0;pointer-events:none}
@media (max-width:820px){.fs-main{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;align-content:center}#fs .big{width:min(64vw,40vh)}.fs-info{align-items:center;width:100%;max-width:520px}.fs-prog,.fs-ctl{width:100%}.fs-foot{justify-content:center}}
.eq{display:flex;gap:4px;height:26px;align-items:flex-end}
.eq i{width:6px;background:#fff;border-radius:3px;height:30%;animation:eq 1s infinite ease-in-out;animation-play-state:paused}
.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* ---- écran de mise à jour ---- */
.boot{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(900px 600px at 50% 30%,rgba(124,77,255,.25),transparent 65%),var(--bg);transition:opacity .4s}
.boot[hidden]{display:none}
.boot.out{opacity:0}
.bootc{width:min(440px,90vw);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.bootlogo{width:64px;height:64px;border-radius:16px;margin-bottom:14px}
.bootlogo svg{width:30px;height:30px}
.bootk{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac2);font-weight:700}
.boot h2{font-size:30px;font-weight:900;letter-spacing:-.03em}
.boot p{color:var(--mut);font-size:13px;min-height:1.4em}
.bootbar{width:100%;height:4px;border-radius:2px;background:#4d4d57;overflow:hidden;margin-top:18px}
.bootbar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.bootp{font-weight:700;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;margin-top:6px}

/* ---- fiche « À propos » ---- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:24px}
.modal[hidden]{display:none}
.mbox{position:relative;width:min(580px,100%);max-height:84vh;overflow:auto;background:var(--panel2);border-radius:12px;padding:28px 30px 22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);user-select:text}
.mbox .x{position:absolute;right:14px;top:14px}
.mbox .mh{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mbox .mh .logo{width:44px;height:44px;border-radius:10px}
.mbox h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mbox .mh small{color:var(--mut);font-size:13px}
.mbox h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac2);margin:18px 0 6px}
.mbox p{color:var(--tx2);line-height:1.6;font-size:14px}
.mbox .foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
.status{margin-left:auto}
@media (max-width:1150px){.search kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.eq i,.eqs i{animation:none}}
</style>

/* Laser Arena = les morceaux des parties de laser game ; LaserBeats = toute la musique du logiciel.
   Anciennes playlists (LaserBeats, Tech Zone, Overdrive dans morceaux.json) : rangées dans Laser Arena. */
const OLD_ARENA=['laserbeats','laser beats','tech zone','overdrive'];
const plKey=s=>String(s||'').trim().toLowerCase();
function impPl(){let p=PL.find(x=>x.id==='imp');if(!p){p={id:'imp',name:'Mes imports',tags:['Fichiers ajoutés'],bpmTxt:'',h:[95,175],tracks:[]};PL.push(p)}return p}
function plFor(name){
 const k=plKey(name);
 if(!k||k==='imp'||k==='mes imports')return impPl();
 if(OLD_ARENA.includes(k)||k==='beats')return PL.find(x=>x.id==='arena');
 let p=PL.find(x=>!x.special&&(x.id===k||plKey(x.name)===k));
 if(!p){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))%360;p={id:'c-'+k,name:String(name).trim(),tags:['Mes morceaux'],h:[h,(h+70)%360],tracks:[]};PL.push(p)}

}
/* Volume mesuré de chaque morceau (LUFS) : fourni par morceaux.json, sinon mesuré une fois puis mémorisé. */
let LUFS=store.get('lufs',{});if(!LUFS||typeof LUFS!=='object')LUFS={};
const mkTrack=t=>({lufs:typeof t.lufs==='number'?t.lufs:(typeof LUFS[t.id]==='number'?LUFS[t.id]:null),id:t.id,pl:plFor(t.playlist).id,title:t.title,artist:t.user?'Importé':'Musique ML',bpm:t.bpm||0,dur:t.dur||0,url:t.url,img:typeof t.img==='string'&&/^file:/.test(t.img)?t.img:'',user:!!t.user});

/* Recalcule le contenu des playlists. LaserBeats liste les playlists qu'elle réunit vraiment. */
function refreshPl(){

 p.tracks=p.id==='beats'?TRACKS.slice():TRACKS.filter(t=>t.pl===p.id);
 const b=p.tracks.map(t=>t.bpm).filter(x=>x>0);
 p.bpmTxt=!b.length?'':Math.min(...b)===Math.max(...b)?b[0]+' BPM':Math.min(...b)+'–'+Math.max(...b)+' BPM';

refreshPl();
const getPl=id=>PL.find(p=>p.id===id)||PL[1];
const allTracks=()=>TRACKS;
/* Favoris et écoutes récentes : on oublie les morceaux qui n'existent plus. */
const known=new Set(TRACKS.map(t=>t.id));
/* Compte connecté : ses favoris, l'ordre de ses playlists et ses écoutes récentes lui sont propres
   (gardés par le processus principal, qui ne donne que ceux du compte connecté). Sans compte : ceux du PC. */
const ACC=LB&&LB.accounts&&LB.accounts.state&&LB.accounts.state.enabled?LB.accounts:null; // null = comptes pas encore activés
let ACCOUNT=ACC&&ACC.state?ACC.state.account:null,PROF=ACC&&ACC.state&&ACC.state.profile?ACC.state.profile:null;
const pget=(k,d)=>{if(ACCOUNT){const v=PROF&&PROF[k];return v===undefined||v===null?d:v}return store.get(k,d)};
const pset=(k,v)=>{if(ACCOUNT){PROF=PROF||{};PROF[k]=v;try{ACC.setProfile(k,v)}catch(e){}}else store.set(k,v)};
let favs=new Set((pget('favs',[])||[]).filter(id=>known.has(id)));
/* Ordre des morceaux choisi par glisser-déposer (par playlist) ; les morceaux non classés gardent l'ordre d'origine, à la fin. */
let ORDER=pget('order',{});if(!ORDER||typeof ORDER!=='object')ORDER={};
function ordered(id,l){const o=ORDER[id];if(!Array.isArray(o)||!o.length)return l;const pos=new Map(o.map((x,i)=>[x,i]));const r=(t,i)=>pos.has(t.id)?pos.get(t.id):1e6+i;return l.map((t,i)=>[t,r(t,i)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0])}
const tracksOf=id=>ordered(id,id==='fav'?TRACKS.filter(t=>favs.has(t.id)):(getPl(id).tracks||[]));

/* ---------- visuels ---------- */
const artStyle=p=>`background:radial-gradient(circle at 22% 18%,hsl(${p.h[0]} 95% 62%),transparent 58%),radial-gradient(circle at 82% 78%,hsl(${p.h[1]} 90% 55%),transparent 58%),linear-gradient(160deg,hsl(${p.h[0]} 55% 22%),hsl(${p.h[1]} 65% 14%))`;

   tArt = CSS brut (pour element.style) ; tArtH = même chose, prêt à mettre dans un attribut HTML. */
/* Visuel d'une playlist : sa pochette si elle en a une, sinon ses couleurs. */
const pArt=p=>p.img?`background:#1c1c22 url("${p.img}") center/cover no-repeat`:artStyle(p);
const tArt=t=>t.img?`background:#1c1c22 url("${t.img}") center/cover no-repeat`:artStyle(getPl(t.pl));

/* ---------- lecteur ---------- */
/* Deux lecteurs audio : pendant qu'un morceau joue, le suivant est déjà chargé dans l'autre,
   pour enchaîner sans blanc. A = lecteur actif, B = lecteur de réserve. */
let A=$('#audio'),B=$('#audio2');
const P={queue:[],i:-1,plId:null,shuffle:false,repeat:1,nx:null};
let want=false; // vrai tant que la musique doit jouer (faux après une pause voulue)
let vol=store.get('vol',.8);if(!(vol>=0&&vol<=1))vol=.8;
/* Même volume pour tous les morceaux : chaque morceau est ramené au niveau du plus doux (jamais monté, seulement baissé). */
const TARGET_LUFS=-7.5;
let normOn=store.get('norm',true)!==false; // réglage « Volume égal »
const gainOf=t=>normOn&&t&&typeof t.lufs==='number'&&t.lufs>TARGET_LUFS?Math.max(.25,Math.pow(10,(TARGET_LUFS-t.lufs)/20)):1;
const vg=el=>vol*(+el.dataset.g||1);
function setVol(v){vol=v;A.volume=vg(A);if(!fade)B.volume=vg(B);store.set('vol',v);$('#vol').style.setProperty('--v',v*100+'%')}
/* Fondu enchaîné : FADE secondes avant la fin, le morceau suivant démarre dans l'autre lecteur
   et monte pendant que le premier descend (courbe à puissance constante : pas de creux de volume). */
const FADE=3;
let fade=null,xfMode=false,xfTried=-1,loadN=0;
function cancelFade(){
 if(!fade)return;
 clearInterval(fade.timer);const o=fade.out;fade=null;
 o.pause();o.removeAttribute('src');o.dataset.tid='';o.load();
 A.volume=vg(A);B.volume=vg(B);
}
function startFade(o){
 cancelFade();
 o.dataset.tid=''; // le lecteur sortant ne doit plus jamais être réutilisé tel quel
 const t0=performance.now();A.volume=0;
 fade={out:o,timer:setInterval(()=>{
  const p=Math.min(1,(performance.now()-t0)/(FADE*1000));
  A.volume=vg(A)*Math.sin(p*Math.PI/2);o.volume=vg(o)*Math.cos(p*Math.PI/2);
  if(p>=1){clearInterval(fade.timer);fade=null;o.pause();o.removeAttribute('src');o.load();o.volume=vol;A.volume=vg(A);preloadNext()}
 },50)};
}
let xfadeOn=store.get('xfade',true)!==false; // réglage « Fondu enchaîné »
function maybeCrossfade(){
 if(!xfadeOn)return;
 if(fade||!want||P.repeat===2||!A.duration||!isFinite(A.duration)||A.duration<FADE*3)return;
 if(A.duration-A.currentTime>FADE||xfTried===loadN)return;
 xfTried=loadN;       // une seule tentative par morceau lancé
 xfMode=true;try{next(true)}finally{xfMode=false}
}
A.volume=vol;B.volume=vol;
let recent=(pget('recent',[])||[]).filter(id=>known.has(id));
let preT=null,errs=0;
function playQueue(list,start,plId,at){
 if(!list.length)return;
 P.queue=list.slice();P.plId=plId;P.nx=null;load(Math.max(0,start),at);
}
function load(i,at){
 const t=P.queue[i];if(!t)return;
 const xf=xfMode&&!A.paused;
 if(!xf)cancelFade();
 P.i=i;want=true;loadN++;
 const url=trackUrl(t);
 const ready=B.dataset.tid===t.id&&B.getAttribute('src')===url&&!B.error;
 if(xf){
  // Fondu : le suivant part dans le lecteur de réserve, le morceau en cours continue en descendant.
  if(!ready){B.src=url}
  const o=A;A=B;B=o;startFade(o);
 }else if(ready){
  const o=A;A=B;B=o; // le morceau est déjà prêt dans le lecteur de réserve
  o.pause();o.removeAttribute('src');o.dataset.tid='';o.load();
 }else A.src=url;
 A.dataset.tid=t.id;A.dataset.g=gainOf(t);if(!fade)A.volume=vg(A);
 if(at>0)A.currentTime=at;
 const pr=A.play();if(pr&&pr.catch)pr.catch(()=>ui());
 recent=[t.id].concat(recent.filter(x=>x!==t.id)).slice(0,12);pset('recent',recent);
 ui();saveState();
 clearTimeout(preT);if(!fade)preT=setTimeout(preloadNext,1500);
}
function peekNext(){
 const n=P.queue.length;if(!n||P.repeat===2)return -1;
 if(P.shuffle&&n>1){if(P.nx===null||P.nx===P.i||P.nx>=n){do{P.nx=Math.floor(Math.random()*n)}while(P.nx===P.i)}return P.nx}
 return P.i+1<n?P.i+1:0;
}
function preloadNext(){
 if(fade)return; // le lecteur de réserve est encore en train de s'éteindre
 const t=P.queue[peekNext()];
 if(!t){if(B.getAttribute('src')){B.removeAttribute('src');B.dataset.tid='';B.load()}return}
 if(B.dataset.tid===t.id&&B.getAttribute('src')===trackUrl(t)&&!B.error)return;
 B.dataset.tid=t.id;B.dataset.g=gainOf(t);B.volume=vg(B);B.src=trackUrl(t);
}
function toggle(){
 if(P.i<0){playQueue(tracksOf('arena'),0,'arena');return}
 if(A.paused){want=true;const pr=A.play();if(pr&&pr.catch)pr.catch(()=>{})}else{want=false;cancelFade();A.pause()}
 saveState();
}
function next(fromEnd){
 if(!P.queue.length)return;
 if(fromEnd&&P.repeat===2){A.currentTime=0;A.play().catch(()=>{});return}
 let n;
 if(P.shuffle&&P.queue.length>1){n=P.nx!==null&&P.nx!==P.i&&P.nx<P.queue.length?P.nx:-1;if(n<0)do{n=Math.floor(Math.random()*P.queue.length)}while(n===P.i)}
 else n=P.i+1;
 P.nx=null;
 if(n>=P.queue.length){
  if(P.repeat===1)n=0;else if(fromEnd){want=false;ui();saveState();return}else n=0;
 }
 load(n);
}
function prev(){
 if(!P.queue.length)return;
 if(A.currentTime>3){A.currentTime=0;return}
 load(P.i>0?P.i-1:P.queue.length-1);
}
function toggleFav(id){
 favs.has(id)?favs.delete(id):favs.add(id);
 pset('favs',[...favs]);ui();
 if(V.name==='pl'&&V.arg==='fav')render();
 sideList();
}
function saveState(){
 const t=P.queue[P.i];
 store.set('resume',{pl:P.plId,id:t?t.id:null,t:t?Math.floor(A.currentTime||0):0,playing:!!t&&want,shuffle:P.shuffle,repeat:P.repeat});
}
function logErr(m){try{if(LB)LB.log(m)}catch(e){}}
window.addEventListener('error',e=>logErr('Erreur interface : '+(e.message||e)+' ('+(e.filename||'').split('/').pop()+':'+(e.lineno||0)+')'));
window.addEventListener('unhandledrejection',e=>logErr('Promesse rejetée : '+(e.reason&&e.reason.message||e.reason)));
[A,B].forEach(el=>{
 el.addEventListener('ended',e=>{if(e.target===A)next(true)});
 el.addEventListener('play',e=>{if(e.target===A)ui()});
 el.addEventListener('pause',e=>{if(e.target===A){ui();saveState()}});
 el.addEventListener('playing',e=>{if(e.target===A)errs=0});
 el.addEventListener('error',e=>{
  if(e.target!==A||!A.getAttribute('src'))return;
  const t=P.queue[P.i];logErr('Lecture impossible : '+(t?t.title:'?')+' (code '+(A.error&&A.error.code)+')');
  if(P.queue.length>1&&errs<P.queue.length){errs++;setTimeout(()=>next(true),400)}
 });
 el.addEventListener('loadedmetadata',e=>{
  const t=P.queue[P.i];
  if(e.target===A&&t&&!t.dur&&isFinite(A.duration)&&A.duration>0){t.dur=A.duration;if(LB)LB.saveDuration(t.id,t.dur)}
 });
 el.addEventListener('timeupdate',e=>{
  if(e.target!==A)return;
  const d=A.duration,c=A.currentTime,r=d?c/d*100:0;
  $('#barF').style.width=r+'%';$('#fsF').style.width=r+'%';$('#fsC').textContent=fmt(c);$('#fsD').textContent=fmt(d);
  $('#tmC').textContent=fmt(c);$('#tm').textContent=fmt(d);
  maybeCrossfade();
 });
});
function seek(e){const el=e.currentTarget,r=el.getBoundingClientRect();if(A.duration)A.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*A.duration}
$('#bar').addEventListener('click',seek);$('#fsBar').addEventListener('click',seek);

/* Surveillance : si la musique devrait jouer mais n'avance plus, on relance (puis on passe au suivant). */
let lastT=-1,stuck=0,fails=0,tick=0;
setInterval(()=>{
 if(++tick%2===0&&want)saveState();
 if(!want||P.i<0){stuck=0;fails=0;lastT=-1;return}
 const c=A.currentTime;
 if(!A.paused&&c!==lastT){stuck=0;fails=0}
 else if(A.ended){logErr('Fin de morceau non signalée, morceau suivant');next(true)}
 else{
  stuck++;
  if(A.paused){const pr=A.play();if(pr&&pr.catch)pr.catch(()=>{})}
  if(stuck>=3){
   stuck=0;fails++;logErr('Lecture bloquée, relance ('+fails+')');
   if(fails>=2&&P.queue.length>1){fails=0;next(true)}
   else{A.load();if(c>0)A.currentTime=c;const pr=A.play();if(pr&&pr.catch)pr.catch(()=>{})}
  }
 }
 lastT=A.currentTime;
},3000);

/* Sortie audio : si une carte son, un ampli ou des enceintes sont branchés ou débranchés,
   on relance le morceau au même endroit pour qu'il sorte bien sur la sortie active. */
let outSig=null,devT=null;
async function outputs(){try{return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audiooutput').map(d=>d.deviceId+'|'+d.groupId+'|'+d.label).sort().join(';')}catch(e){return null}}
async function onDevices(){
 const sig=await outputs();
 if(sig!==null&&sig===outSig)return;  // rien n'a changé côté sorties audio
 outSig=sig;
 if(!want||P.i<0)return;
 cancelFade();
 const t=A.currentTime;logErr('Sortie audio modifiée : relance du morceau à '+Math.floor(t)+' s');
 A.load();if(t>0)A.currentTime=t;const pr=A.play();if(pr&&pr.catch)pr.catch(()=>{});
 if(B.getAttribute('src'))B.load();
}
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener){
 outputs().then(sig=>{outSig=sig});
 navigator.mediaDevices.addEventListener('devicechange',()=>{clearTimeout(devT);devT=setTimeout(onDevices,1500)});
}
/* Reprise : si Musique ML jouait à sa fermeture (ou après une coupure), la musique repart. */
function resume(){
 const R=store.get('resume',null);if(!R||typeof R!=='object')return;
 P.shuffle=!!R.shuffle;P.repeat=[0,1,2].includes(R.repeat)?R.repeat:1;
 if(!R.playing||!R.id){ui();return}
 const t=trackById(R.id);
 if(!t){ // morceau retiré depuis : on repart sur sa playlist (ou Laser Arena) plutôt que de rester muet
  const own=tracksOf(R.pl),l=own.length?own:tracksOf('arena');
  if(l.length)playQueue(l,0,own.length?R.pl:'arena');else ui();
  return;
 }
 let l=tracksOf(R.pl),k=l.findIndex(x=>x.id===R.id);if(k<0){l=[t];k=0}
 playQueue(l,k,R.pl,R.t>0&&(!t.dur||R.t<t.dur-3)?R.t:0);
}
/* Durée des morceaux ajoutés : lue une fois dans le fichier puis mémorisée. */
function probe(list){
 const todo=list.filter(t=>!t.dur);if(!todo.length)return;
 const a=new Audio();a.preload='metadata';a.muted=true;let k=0,changed=false;
 const step=()=>{
  const t=todo[k++];
  if(!t){a.removeAttribute('src');a.load();if(changed)render();return}
  a.onloadedmetadata=()=>{if(isFinite(a.duration)&&a.duration>0){t.dur=a.duration;changed=true;if(LB)LB.saveDuration(t.id,t.dur)}step()};
  a.onerror=step;a.src=trackUrl(t);
 };
 step();
}
/* Suppression d'un morceau importé (les morceaux fournis avec le logiciel ne se suppriment pas). */
async function delTrack(id){
 const t=trackById(id);if(!t||!t.user||!LB||!LB.deleteTrack)return;
 let ok=false;try{ok=await LB.confirmDelete(t.title)}catch(e){}
 if(!ok)return;
 // On libère le fichier avant de l'effacer : s'il joue, on passe au suivant.
 cancelFade();
 const cur=P.queue[P.i];
 if(cur&&cur.id===id){
  const rest=P.queue.filter(x=>x.id!==id);
  if(rest.length&&want){P.queue=rest;P.nx=null;load(Math.min(P.i,rest.length-1))}
  else{want=false;A.pause();A.removeAttribute('src');A.dataset.tid='';A.load();P.queue=rest;P.i=-1}
 }
 if(B.dataset.tid===id){B.removeAttribute('src');B.dataset.tid='';B.load()}
 let done=false;try{done=await LB.deleteTrack(id)}catch(e){logErr('Suppression : '+e)}

 const k=TRACKS.findIndex(x=>x.id===id);if(k>=0)TRACKS.splice(k,1);
 if(favs.delete(id))pset('favs',[...favs]);
 recent=recent.filter(x=>x!==id);pset('recent',recent);
 const now=P.queue[P.i];P.queue=P.queue.filter(x=>x.id!==id);P.i=now?P.queue.indexOf(now):-1;P.nx=null;
 refreshPl();
 render();saveState();clearTimeout(preT);preT=setTimeout(preloadNext,500);
}
async function importTracks(playlist){
 if(!LB)return;
 let list=[];try{list=await LB.importTracks(playlist||'')}catch(e){logErr('Import : '+e)}
 if(!list||!list.length)return;
 const added=[];
 list.forEach(x=>{if(!trackById(x.id)){const t=mkTrack(x);TRACKS.push(t);added.push(t)}});
 refreshPl();
 const t0=trackById(list[0].id);
 go('pl',t0?t0.pl:'imp');
 probe(added);setTimeout(measureAll,1500);
}

function act(n,d){
 switch(n){
  case 'go':go(d.v);break;
  case 'open-pl':go('pl',d.id);break;
  case 'play-pl':{const l=tracksOf(d.id);if(l.length){playQueue(l,0,d.id)}else go('pl',d.id);break}
  case 'pl-toggle':{if(P.plId===d.id&&P.i>=0&&P.queue.length)toggle();else act('play-pl',d);break}
  case 'shuf-pl':{const l=tracksOf(d.id);if(l.length){P.shuffle=true;playQueue(l,Math.floor(Math.random()*l.length),d.id)}break}
  case 'play-track':{const l=tracksOf(d.pl);const k=l.findIndex(t=>t.id===d.id);if(k>=0)playQueue(l,k,d.pl);else{const t=trackById(d.id);if(t)playQueue([t],0,t.pl)}break}
  case 'fav':toggleFav(d.id);break;
  case 'del':delTrack(d.id);break;
  case 'import':importTracks(d.pl);break;
  case 'set':{
   const k=d.k;
   if(k==='xfade'){xfadeOn=!xfadeOn;store.set('xfade',xfadeOn)}
   else if(k==='norm'){normOn=!normOn;store.set('norm',normOn);[A,B].forEach(el=>{const t=trackById(el.dataset.tid);el.dataset.g=gainOf(t);if(!fade)el.volume=vg(el)});nowPanel()}
   else if(k==='rp')setRp(!$('#app').classList.contains('rp'),true);
   else if(k==='mini'){const m=!$('#app').classList.contains('mini');setMini(m);store.set('mini',m)}
   if(V.name==='settings')render();
   break;
  }
  case 'about':about(true);break;
  case 'legal':about(false);go('legal',d.id);break;
  case 'acct-login':if(ACC)loginSheet();break;
  case 'acct-new':if(ACC)createSheet();break;
  case 'acct-pw':pwSheet();break;
  case 'acct-del':delSheet();break;
  case 'acct-logout':if(ACC)ACC.logout().then(()=>setAccount(null));break;
  case 'reset-order':delete ORDER[d.id];pset('order',ORDER);syncQueue(d.id);render();break;
 }
}

const calm=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const OPEN_EASE='cubic-bezier(.32,.72,0,1)',CLOSE_EASE='cubic-bezier(.4,0,.2,1)';

  if(started)return;started=true;document.removeEventListener('fullscreenchange',go);
  requestAnimationFrame(()=>{
   if(!f.classList.contains('show'))return; // déjà refermé entre-temps
   f.classList.remove('pre');

   fsBusy=true;fsOpening=true;const art=$('#fsArt'),thumb=$('#npArt'),T=fromThumb(),D=620;
   thumb.style.visibility='hidden';
   const fin=()=>{fsBusy=false;fsOpening=false;openAnims=[];thumb.style.visibility='';art.style.transformOrigin=''};
   const clip=f.animate([{clipPath:bannerClip()},{clipPath:'inset(0px 0px 0px 0px round 0px)'}],{duration:D,easing:OPEN_EASE});
   openAnims=[clip];clip.onfinish=fin;clip.oncancel=fin;
   openAnims.push($('#fsBg').animate([{opacity:0},{opacity:1}],{duration:900,easing:'ease-out'}));

 };

/* ---------- volume égal : mesure des morceaux ----------
   Mesure du volume perçu (norme EBU R128 / ITU BS.1770 : filtre « K » puis moyenne sur des blocs de 400 ms,
   en ignorant les silences). Faite une seule fois par morceau, en arrière-plan, puis mémorisée. */
const KW=[[1.53512485958697,-2.69169618940638,1.19839281085285,-1.69065929318241,0.73248077421585],[1,-2,1,-1.99004745483398,0.99007225036621]];
function lufsOf(buf){
 const sr=buf.sampleRate,step=Math.round(sr*.1),blk=step*4,n=buf.length;
 if(n<blk)return null;
 const nb=Math.floor((n-blk)/step)+1,sq=new Float64Array(Math.floor(n/step)+1);
 for(let c=0;c<Math.min(2,buf.numberOfChannels);c++){
  let inp=buf.getChannelData(c);
  for(const [b0,b1,b2,a1,a2] of KW){
   const out=new Float32Array(n);let x1=0,x2=0,y1=0,y2=0;
   for(let i=0;i<n;i++){const v=inp[i],r=b0*v+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=v;y2=y1;y1=r;out[i]=r}
   inp=out;
  }
  for(let i=0;i<n;i++)sq[Math.floor(i/step)]+=inp[i]*inp[i];
 }
 const z=[];for(let k=0;k<nb;k++){z.push((sq[k]+sq[k+1]+sq[k+2]+sq[k+3])/blk)}
 const L=v=>-0.691+10*Math.log10(v);
 const abs=z.filter(v=>v>0&&L(v)>-70);if(!abs.length)return null;
 const rel=L(abs.reduce((a,b)=>a+b,0)/abs.length)-10;
 const g=abs.filter(v=>L(v)>rel);
 return Math.round(L(g.reduce((a,b)=>a+b,0)/g.length)*10)/10;
}
async function measure(t){
 if(!LB||!LB.readAudio)return;
 const bytes=await LB.readAudio(t.id);if(!bytes)return;
 const ab=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
 const ctx=new OfflineAudioContext(2,1,48000);
 const buf=await ctx.decodeAudioData(ab);
 const v=lufsOf(buf);if(v===null)return;
 t.lufs=v;LUFS[t.id]=v;store.set('lufs',LUFS);
 // morceau déjà chargé : sa correction s'applique tout de suite
 [A,B].forEach(el=>{if(el.dataset.tid===t.id){el.dataset.g=gainOf(t);if(!fade)el.volume=vg(el)}});
 if(P.queue[P.i]&&P.queue[P.i].id===t.id)nowPanel();
}

 }}finally{measuring=false}
}

acctChip();
document.querySelectorAll('button[title]:not([aria-label])').forEach(b=>b.setAttribute('aria-label',b.title));
setRp(rpW&&store.get('rp',true));
if(LB&&LB.version)$('#ver').textContent='v'+LB.version;
/* Mise à jour automatique : quand une nouvelle version est téléchargée, un bouton apparaît. */
function updReady(v){if(!v)return;updV=v;const el=$('#upd');el.hidden=false;el.innerHTML=`<button class="pill pri" id="updBtn" title="Installer la mise à jour ${esc(v)}">${ic('bolt')}<span>Installer la mise à jour ${esc(v)}</span></button><div class="sub">Elle s'installera au prochain lancement de Musique ML, ou tout de suite si vous cliquez ici (redémarrage d'environ 20 s, puis la musique reprend).</div>`;$('#updBtn').onclick=()=>installUpd('bouton')}
/* La mise à jour téléchargée ne s'installe que sur décision : bouton, ou fermeture volontaire de Musique ML. */
let updV=null,updDone=false;
/* Écran de mise à jour : la barre avance vite puis ralentit (courbe « ease-out »), sans jamais reculer
   ni s'arrêter ; le pourcentage affiché correspond toujours à la longueur de la barre et atteint 100 % à la fin. */
function updateScreen(kicker,titleTxt,sub,ms){
 const b=$('#boot');b.classList.remove('out');b.hidden=false;
 $('#bootK').textContent=kicker;$('#bootT').textContent=titleTxt;$('#bootS').textContent=sub;
 return new Promise(res=>{
  const t0=performance.now();
  const step=()=>{
   const t=Math.min(1,(performance.now()-t0)/ms),p=1-Math.pow(1-t,3);
   $('#bootF').style.width=(p*100).toFixed(2)+'%';$('#bootP').textContent=Math.round(p*100)+' %';
   if(t<1)requestAnimationFrame(step);else res();
  };
  requestAnimationFrame(step);
 });
}
function hideUpdateScreen(){const b=$('#boot');b.classList.add('out');setTimeout(()=>{b.hidden=true;b.classList.remove('out')},400)}
async function installUpd(why){
 if(!updV||updDone||!LB||!LB.installUpdate)return;
 updDone=true;logErr('Installation de la mise à jour '+updV+' ('+why+')');
 if(why!=='lancement')saveState(); // au lancement, on garde l'état de la session précédente pour la reprise
 const b=$('#updBtn');if(b){b.disabled=true;b.textContent='Installation…'}
 await updateScreen('Mise à jour','Musique ML '+updV,'Préparation de la nouvelle version…',4000);
 $('#bootS').textContent='Installation en cours : Musique ML redémarre dans un instant.';
 LB.installUpdate();
}
if(LB&&LB.onUpdate){updReady(LB.updateReady);LB.onUpdate(updReady)}
const h0=(location.hash||'').slice(1);
V={name:['home','all','lib'].includes(h0)?h0:'home',arg:null};
render();
const hadResume=!!store.get('resume',null); // lu avant toute sauvegarde de ce lancement
const migrateV2=!store.get('v2',false);if(migrateV2)store.set('v2',true);
(function(){
 const v=LB&&LB.version,prev=store.get('lastVersion',null);
 if(!v)return;
 store.set('lastVersion',v);
 // ancienne version sans ce repère : on la reconnaît à son état de lecture déjà enregistré
 const updated=prev?prev!==v:hadResume;
 if(updated)updateScreen('Mise à jour installée','Musique ML '+v,'Finalisation de la mise à jour…',3000).then(hideUpdateScreen);
})();
/* Lancement : s'il y a une mise à jour prête, elle s'installe AVANT de démarrer la musique.
   Sécurité : après 2 tentatives ratées pour une même version, on arrête de réessayer au lancement. */
function launchTryOk(v){
 const t=store.get('updTry',{})||{};
 if(t.v===v&&t.n>=2){logErr('Mise à jour '+v+' : 2 tentatives sans succès, installation au lancement suspendue');return false}
 store.set('updTry',{v,n:(t.v===v?t.n:0)+1});return true;
}
(async function startup(){
 let v=null;
 if(LB&&LB.launchUpdateCheck){try{v=await LB.launchUpdateCheck()}catch(e){v=null}}
 if(v&&v!==(LB&&LB.version)&&launchTryOk(v)){updV=v;installUpd('lancement');return}
 resume();
 if(migrateV2){P.repeat=1;ui();saveState()}
})();
probe(TRACKS);
setTimeout(measureAll,5000);
window.addEventListener('beforeunload',saveState);
})();
</script>
</body>
</html>
