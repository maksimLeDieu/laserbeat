# Essai de la version Mac (branche « mac » seulement) : compilation, signature locale, tests.
# Rien n'est publié : le .dmg est seulement joint au résultat de l'essai.
name: Essai Mac

on:
  push:
    branches: [mac]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compiler le .dmg
        run: npx electron-builder --mac dmg --universal --publish never -c.productName="Musique ML"
      - name: Contenu et signature
        run: |
          ls -la dist
          ls dist/mac-universal
          codesign -dv --verbose=2 "dist/mac-universal/Musique ML.app" 2>&1 | head -20
          codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Musique ML.app" 2>&1 | tail -5
          defaults read "$PWD/dist/mac-universal/Musique ML.app/Contents/Info.plist" CFBundleName
      - name: Tests automatiques sur le logiciel compilé
        continue-on-error: false
        run: npm test
        env:
          LASERBEAT_EXE: dist/mac-universal/Musique ML.app/Contents/MacOS/Musique ML
      - uses: actions/upload-artifact@v4
        with:
          name: Musique-ML-Mac
          path: dist/Musique-ML-Mac.dmg
          retention-days: 7
