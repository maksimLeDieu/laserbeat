# Publie une nouvelle version de LaserBeat.
# Déclenchement : un changement de package.json sur la branche main (nouveau numéro de version),
# ou à la main depuis l'onglet Actions (« Run workflow »).
# Le robot compile l'installateur sur Windows puis crée la Release GitHub « vX.Y.Z »
# (LaserBeat-Setup.exe, .blockmap et latest.yml) : les PC équipés de LaserBeat
# la téléchargent ensuite tout seuls. Si la Release de cette version existe déjà, rien n'est republié.
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version déjà publiée ?
        id: deja
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx latest.yml; then
              echo "La Release $v est complète : rien à publier."; echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "La Release $v est incomplète : elle sera complétée."; echo "mode=upload" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deja.outputs.skip != 'true'
        run: npm ci
      - name: Compiler l'installateur
        if: steps.deja.outputs.skip != 'true'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publier la Release
        if: steps.deja.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.deja.outputs.version }}"
          files="dist/LaserBeat-Setup.exe dist/LaserBeat-Setup.exe.blockmap dist/latest.yml"
          if [ "${{ steps.deja.outputs.mode }}" = "upload" ]; then
            # Les 3 fichiers sont remplacés ensemble pour qu'ils viennent de la même compilation.
            gh release upload "$v" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "LaserBeat ${v#v}" --notes "Mise à jour de LaserBeat ${v#v}. Les PC équipés la récupèrent automatiquement." \
              $files
          fi
