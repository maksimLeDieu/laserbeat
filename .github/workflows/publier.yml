# Publie une nouvelle version de LaserBeat.
# Déclenchement : un changement de package.json sur la branche main (nouveau numéro de version),
# ou à la main depuis l'onglet Actions (« Run workflow »).
# Le robot compile l'installateur sur Windows puis crée la Release GitHub « vX.Y.Z »
# (LaserBeat-Setup.exe, .blockmap et latest.yml) : les PC équipés de LaserBeat
# la téléchargent ensuite tout seuls. Si la Release de cette version existe déjà, rien n'est republié.
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version déjà publiée ?
        id: deja
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La Release $v existe déjà : rien à publier."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deja.outputs.skip != 'true'
        run: npm ci
      - name: Compiler et publier
        if: steps.deja.outputs.skip != 'true'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
