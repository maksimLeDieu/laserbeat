# Vérifie puis publie LaserBeat.
# À chaque envoi sur main (ou à la main depuis l'onglet Actions) :
#   1. compilation de l'installateur sur Windows ;
#   2. tests automatiques sur le logiciel compilé (lecture, enchaînement, Agenda, réglages,
#      import/suppression, plantage, mise à jour, sortie audio, redémarrage de nuit…) ;
#   3. si TOUS les tests passent et que le numéro de version de package.json n'est pas encore publié,
#      création de la Release GitHub « vX.Y.Z » : les PC équipés de LaserBeat l'installent tout seuls.
# Un seul test en échec = rien n'est publié.
name: Vérifier et publier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version déjà publiée ?
        id: deja
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx latest.yml; then
              echo "La Release $v est complète : tests seulement."; echo "mode=skip" >> "$GITHUB_OUTPUT"
            else
              echo "La Release $v est incomplète : elle sera complétée."; echo "mode=upload" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - name: Compiler l'installateur
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Tests automatiques sur le logiciel compilé
        run: npm test
        env:
          LASERBEAT_EXE: dist/win-unpacked/LaserBeat.exe
      - name: Publier la Release
        if: steps.deja.outputs.mode != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.deja.outputs.version }}"
          files="dist/LaserBeat-Setup.exe dist/LaserBeat-Setup.exe.blockmap dist/latest.yml"
          if [ "${{ steps.deja.outputs.mode }}" = "upload" ]; then
            gh release upload "$v" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "LaserBeat ${v#v}" --notes "Mise à jour de LaserBeat ${v#v}. Les PC équipés la récupèrent et l'installent automatiquement." \
              $files
          fi
