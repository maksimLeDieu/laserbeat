<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1000" height="1000"></canvas>
<script>
/* Pochettes des morceaux LaserBeat — illustrations originales (rap, phonk, drift, rock).
   Rendu dans Chromium puis « développé » en Python (grain, bloom, vignettage). */
const W=1000,H=1000,c=document.getElementById('c'),x=c.getContext('2d');
let seed=1;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+(b-a)*rnd();
function layer(fn,blur,alpha,mode){const l=document.createElement('canvas');l.width=W;l.height=H;const g=l.getContext('2d');fn(g);x.save();x.globalCompositeOperation=mode||'source-over';x.globalAlpha=alpha==null?1:alpha;x.filter=blur?`blur(${blur}px)`:'none';x.drawImage(l,0,0);x.restore()}
const add=(fn,blur,a)=>layer(fn,blur,a,'lighter');
function bg(stops,vertical=true){const gr=vertical?x.createLinearGradient(0,0,0,H):x.createLinearGradient(0,0,W,H);stops.forEach(([o,col])=>gr.addColorStop(o,col));x.fillStyle=gr;x.fillRect(0,0,W,H)}
function smoke(rgb,n,rmin,rmax,a,area){add(g=>{for(let i=0;i<n;i++){const [x0,x1,y0,y1]=area||[-100,W+100,-100,H+100];const cx=R(x0,x1),cy=R(y0,y1),r=R(rmin,rmax);const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,`rgba(${rgb},${a*R(.5,1)})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(cx-r,cy-r,2*r,2*r)}},14,1)}
function beam(x1,y1,x2,y2,rgb,w,s=1){const line=(g,lw,col)=>{g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};
 add(g=>line(g,w*16,`rgba(${rgb},${.10*s})`),24);add(g=>line(g,w*4,`rgba(${rgb},${.4*s})`),6);add(g=>line(g,w*1.4,`rgba(${rgb},${.95*s})`),1);add(g=>line(g,w*.5,`rgba(255,255,255,${.8*s})`),.5)}
function glow(px,py,r,rgb,a=1){add(g=>{const gr=g.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(.12,`rgba(${rgb},${a*.9})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(px-r,py-r,2*r,2*r)},2)}
function cone(px,py,ang,spread,len,rgb,a){add(g=>{const gr=g.createRadialGradient(px,py,0,px,py,len);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.beginPath();g.moveTo(px,py);g.arc(px,py,len,ang-spread,ang+spread);g.closePath();g.fill()},28)}
function particles(n,area,rgb,rmax,a){add(g=>{for(let i=0;i<n;i++){g.fillStyle=`rgba(${rgb},${R(.2,a)})`;g.beginPath();g.arc(R(area[0],area[1]),R(area[2],area[3]),R(.6,rmax),0,7);g.fill()}},.8)}
function reflect(y0,a=.3,blur=8){const l=document.createElement('canvas');l.width=W;l.height=H;const g=l.getContext('2d');g.translate(0,2*y0);g.scale(1,-1);g.drawImage(c,0,0);x.save();x.beginPath();x.rect(0,y0,W,H-y0);x.clip();x.globalAlpha=a;x.globalCompositeOperation='lighter';x.filter=`blur(${blur}px)`;x.drawImage(l,0,0);x.restore()}

const S={
/* 1. Phonk Laser Game : micro de studio en contre-jour, laser rouge derrière */
mic(){seed=101;bg([[0,'#12041c'],[1,'#030106']]);
 smoke('150,40,220',22,160,420,.10);smoke('255,30,90',8,120,300,.06);
 beam(-20,300,1020,560,'255,30,50',1.6,.9);beam(-20,620,1020,240,'255,40,120',1.1,.6);
 cone(500,-80,Math.PI/2,.32,900,'210,150,255',.30);
 const cx=500,top=210;
 // grille du micro
 layer(g=>{g.save();g.beginPath();g.ellipse(cx,top+170,150,175,0,0,7);g.clip();
  const gr=g.createRadialGradient(cx-60,top+110,10,cx,top+170,200);gr.addColorStop(0,'#b9b3c6');gr.addColorStop(.35,'#4b4459');gr.addColorStop(1,'#0c0a12');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=2;for(let k=-400;k<400;k+=11){g.beginPath();g.moveTo(cx+k-200,top-50);g.lineTo(cx+k+200,top+400);g.stroke();g.beginPath();g.moveTo(cx+k+200,top-50);g.lineTo(cx+k-200,top+400);g.stroke()}
  g.restore();g.lineWidth=10;g.strokeStyle='#1d1a24';g.beginPath();g.ellipse(cx,top+170,150,175,0,0,7);g.stroke();
  g.lineWidth=14;g.strokeStyle='#2a2633';g.beginPath();g.moveTo(cx-150,top+175);g.lineTo(cx+150,top+175);g.stroke()},0,1);
 // corps
 layer(g=>{const gr=g.createLinearGradient(cx-110,0,cx+110,0);gr.addColorStop(0,'#08070c');gr.addColorStop(.3,'#3d3846');gr.addColorStop(.5,'#8d869a');gr.addColorStop(.7,'#2b2732');gr.addColorStop(1,'#060509');
  g.fillStyle=gr;g.beginPath();g.moveTo(cx-118,top+330);g.lineTo(cx+118,top+330);g.lineTo(cx+80,top+640);g.lineTo(cx-80,top+640);g.closePath();g.fill();
  g.fillStyle='#14121a';g.fillRect(cx-122,top+330,244,26);g.fillRect(cx-84,top+620,168,24);
  g.fillStyle='#0a090d';g.fillRect(cx-18,top+644,36,400)},0,1);
 // liseré lumineux à droite
 add(g=>{g.strokeStyle='rgba(255,70,170,.9)';g.lineWidth=5;g.beginPath();g.ellipse(cx,top+170,150,175,0,-1.2,.9);g.stroke();g.beginPath();g.moveTo(cx+118,top+340);g.lineTo(cx+80,top+640);g.stroke()},5,.9);
 add(g=>{g.strokeStyle='rgba(180,140,255,.8)';g.lineWidth=3;g.beginPath();g.ellipse(cx,top+170,150,175,0,2.4,3.6);g.stroke()},4,.7);
 particles(140,[0,1000,0,1000],'255,180,230',1.8,.5);
 reflect(900,.18)},

/* 2. Phonk : cassette audio, néon violet, esprit Memphis */
cassette(){seed=202;bg([[0,'#1a0630'],[1,'#05020b']]);
 smoke('170,60,255',18,160,400,.10);
 add(g=>{g.strokeStyle='rgba(255,60,200,1)';g.lineWidth=10;g.beginPath();g.arc(500,500,410,0,7);g.stroke()},16,.55);
 add(g=>{g.strokeStyle='rgba(255,140,230,1)';g.lineWidth=3;g.beginPath();g.arc(500,500,410,0,7);g.stroke()},2,.7);
 const w=620,h=400;
 layer(g=>{g.translate(500,520);g.rotate(-.18);g.shadowColor='rgba(0,0,0,.8)';g.shadowBlur=60;g.shadowOffsetY=30;
  const gr=g.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,'#26222e');gr.addColorStop(1,'#0d0b11');g.fillStyle=gr;g.beginPath();g.roundRect(-w/2,-h/2,w,h,26);g.fill();g.shadowColor='transparent';
  // étiquette
  const lg=g.createLinearGradient(-w/2,0,w/2,0);lg.addColorStop(0,'#ffd9ec');lg.addColorStop(1,'#f3c4ff');g.fillStyle=lg;g.beginPath();g.roundRect(-w/2+34,-h/2+30,w-68,240,14);g.fill();
  ['#ff3d8b','#9b4dff','#26d7ff'].forEach((col,i)=>{g.fillStyle=col;g.fillRect(-w/2+34,-h/2+226+i*12,w-68,8)});
  g.fillStyle='#1b0e24';g.font='900 46px "Inter"';g.fillText('PHONK',-w/2+60,-h/2+84);g.font='700 18px "Inter"';g.textAlign='right';g.fillText('LASERBEAT · A · 145 BPM',w/2-60,-h/2+80);g.textAlign='left';
  // fenêtre + bobines
  g.fillStyle='#08070b';g.beginPath();g.roundRect(-150,-h/2+112,300,96,48);g.fill();
  [-95,95].forEach(dx=>{g.fillStyle='#3a2f1f';g.beginPath();g.arc(dx,-h/2+160,dx<0?44:30,0,7);g.fill();g.fillStyle='#e9e4f0';g.beginPath();g.arc(dx,-h/2+160,20,0,7);g.fill();g.fillStyle='#08070b';for(let k=0;k<6;k++){const a=k*Math.PI/3;g.fillRect(dx+Math.cos(a)*12-3,-h/2+160+Math.sin(a)*12-3,6,6)}});
  // bas trapézoïdal + vis
  g.fillStyle='#16131b';g.beginPath();g.moveTo(-200,h/2);g.lineTo(-170,h/2-90);g.lineTo(170,h/2-90);g.lineTo(200,h/2);g.closePath();g.fill();
  [[-w/2+20,-h/2+20],[w/2-20,-h/2+20],[-w/2+20,h/2-20],[w/2-20,h/2-20],[0,h/2-50]].forEach(([a,b])=>{g.fillStyle='#4a4553';g.beginPath();g.arc(a,b,8,0,7);g.fill()});
 },0,1);
 add(g=>{g.translate(500,520);g.rotate(-.18);g.strokeStyle='rgba(200,120,255,.9)';g.lineWidth=4;g.beginPath();g.roundRect(-w/2,-h/2,w,h,26);g.stroke()},6,.6);
 particles(90,[0,1000,0,1000],'220,170,255',1.6,.5)},

/* 3. Mandelao : favela la nuit, mille fenêtres, lasers verts et jaunes */
favela(){seed=303;bg([[0,'#03140f'],[.55,'#0a2a1a'],[1,'#020604']]);
 smoke('60,255,140',16,200,450,.08,[-100,1100,-100,600]);
 for(let i=0;i<9;i++){const a=-Math.PI/2+(i-4)*.16;beam(500,1020,500+Math.cos(a)*1300,1020+Math.sin(a)*1300,i%2?'60,255,90':'255,220,40',1,.55)}
 // colline
 const hill=g=>{g.beginPath();g.moveTo(-10,1010);g.lineTo(-10,640);g.bezierCurveTo(200,560,360,600,520,540);g.bezierCurveTo(700,490,850,560,1010,520);g.lineTo(1010,1010);g.closePath()};
 layer(g=>{hill(g);g.fillStyle='#050806';g.fill()},0,1);
 // maisons et fenêtres
 layer(g=>{hill(g);g.clip();for(let i=0;i<1300;i++){const px=R(0,1000),py=R(500,1000)+R(0,1)*R(0,60);const w=R(14,34),h=R(12,24);const sh=R(.06,.16);g.fillStyle=`rgb(${18*sh*10|0},${20*sh*10|0},${18*sh*10|0})`;g.fillRect(px,py,w,h);if(rnd()<.3){const col=rnd()<.7?`rgba(255,${R(170,220)|0},${R(90,140)|0},${R(.6,1)})`:rnd()<.5?`rgba(120,255,170,${R(.5,.9)})`:`rgba(170,200,255,${R(.5,.9)})`;g.fillStyle=col;g.fillRect(px+w*.25,py+h*.25,Math.max(2,w*.3),Math.max(2,h*.4))}}},0,1);
 add(g=>{hill(g);g.clip();for(let i=0;i<250;i++){g.fillStyle=`rgba(255,${R(150,210)|0},90,${R(.15,.45)})`;g.beginPath();g.arc(R(0,1000),R(520,1000),R(1,3),0,7);g.fill()}},3,1);
 for(let i=0;i<10;i++)glow(R(0,1000),R(580,980),R(18,36),'255,160,60',.5);
 smoke('255,190,90',10,150,300,.06,[0,1000,450,700]);
 particles(80,[0,1000,0,400],'200,255,200',1.5,.5)},

/* 4. Drift Hardbass : voiture en dérapage, fumée de pneus éclairée en rouge */
drift(){seed=404;bg([[0,'#0b0306'],[.62,'#1a0608'],[.63,'#090304'],[1,'#020101']]);
 cone(120,-60,Math.PI/2+.2,.3,900,'255,140,90',.25);
 const ground=700;
 // fumée de pneus (derrière la voiture, à droite)
 smoke('255,60,40',50,100,300,.22,[600,1150,360,780]);smoke('255,170,150',26,80,220,.12,[640,1100,420,740]);
 // voiture (profil, vers la gauche, légèrement en angle)
 const car=g=>{g.beginPath();g.moveTo(130,ground-40);g.lineTo(140,ground-95);g.quadraticCurveTo(170,ground-125,260,ground-130);g.lineTo(380,ground-140);g.quadraticCurveTo(450,ground-215,560,ground-220);g.lineTo(660,ground-215);g.quadraticCurveTo(730,ground-200,790,ground-145);g.lineTo(870,ground-130);g.quadraticCurveTo(900,ground-115,905,ground-80);g.lineTo(900,ground-40);g.closePath()};
 layer(g=>{car(g);const gr=g.createLinearGradient(0,ground-220,0,ground-40);gr.addColorStop(0,'#2a2a30');gr.addColorStop(.45,'#0d0d10');gr.addColorStop(1,'#050506');g.fillStyle=gr;g.fill();
  g.fillStyle='#08080b';g.beginPath();g.moveTo(420,ground-145);g.quadraticCurveTo(470,ground-200,560,ground-204);g.lineTo(640,ground-200);g.quadraticCurveTo(700,ground-185,735,ground-150);g.closePath();g.fill();
  [[265,ground-40],[760,ground-40]].forEach(([a,b])=>{g.fillStyle='#030303';g.beginPath();g.arc(a,b,62,0,7);g.fill();g.fillStyle='#2b2b30';g.beginPath();g.arc(a,b,40,0,7);g.fill();g.strokeStyle='#5a5a62';g.lineWidth=4;for(let k=0;k<5;k++){const an=k*1.2566;g.beginPath();g.moveTo(a,b);g.lineTo(a+Math.cos(an)*36,b+Math.sin(an)*36);g.stroke()}})},0,1);
 // reflets de carrosserie et feux
 add(g=>{g.strokeStyle='rgba(255,120,120,.7)';g.lineWidth=3;g.beginPath();g.moveTo(380,ground-140);g.quadraticCurveTo(450,ground-215,560,ground-220);g.lineTo(660,ground-215);g.stroke()},3,.7);
 add(g=>{g.fillStyle='rgba(255,20,20,1)';g.fillRect(885,ground-118,22,26)},4,1);glow(900,ground-105,120,'255,20,20',.9);
 add(g=>{g.fillStyle='rgba(255,255,230,1)';g.fillRect(132,ground-98,18,16)},3,1);glow(140,ground-90,90,'255,240,200',.9);
 cone(130,ground-90,Math.PI+.06,.12,700,'255,245,220',.35);
 reflect(ground+22,.32,10);
 particles(120,[500,1000,400,760],'255,150,140',1.6,.5)},

/* 5. Drift Hardbass II : barres d'immeubles la nuit, lampadaires au sodium, neige */
blocks(){seed=505;bg([[0,'#071022'],[.7,'#141a2a'],[1,'#05060a']]);
 smoke('120,150,255',10,200,400,.06,[-100,1100,-100,500]);
 const bld=[[40,250,330,1000],[380,140,700,1000],[740,300,980,1000]];
 bld.forEach(([x0,y0,x1,y1],bi)=>{
  layer(g=>{const gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,'#1a1d26');gr.addColorStop(1,'#0c0e14');g.fillStyle=gr;g.fillRect(x0,y0,x1-x0,y1-y0)},0,1);
  layer(g=>{for(let yy=y0+22;yy<y1-60;yy+=34)for(let xx=x0+16;xx<x1-30;xx+=30){const r=rnd();let col='#07080c';if(r<.28)col=`rgb(255,${R(170,215)|0},${R(90,140)|0})`;else if(r<.34)col=`rgb(${R(90,140)|0},${R(150,200)|0},255)`;else if(r<.38)col='#e8eefc';g.fillStyle=col;g.fillRect(xx,yy,16,20)}},0,1);
  add(g=>{for(let yy=y0+22;yy<y1-60;yy+=34)for(let xx=x0+16;xx<x1-30;xx+=30){if(rnd()<.2){g.fillStyle='rgba(255,180,90,.35)';g.fillRect(xx-6,yy-6,28,32)}}},6,1)});
 // lampadaires au sodium
 [[180,840],[560,860],[880,850]].forEach(([a,b])=>{layer(g=>{g.fillStyle='#050608';g.fillRect(a-4,b,8,200)},0,1);glow(a,b,160,'255,150,40',.85);cone(a,b,Math.PI/2,.55,300,'255,150,40',.4)});
 smoke('255,140,50',10,120,260,.08,[0,1000,700,1000]);
 particles(450,[0,1000,0,1000],'235,240,255',2.2,.8);
 add(g=>{g.fillStyle='rgba(220,230,255,.06)';g.fillRect(0,930,1000,70)},10,1)},

/* 6. Hard Rock : guitare électrique en contre-jour, projecteurs, étincelles */
guitar(){seed=606;bg([[0,'#120604'],[1,'#030101']]);
 [[150,.30],[380,.10],[620,-.10],[850,-.30]].forEach(([a,s])=>cone(a,-60,Math.PI/2+s,.11,1000,'255,170,90',.55));
 smoke('255,120,40',22,150,400,.09);
 beam(-20,180,1020,420,'255,40,30',1.2,.55);beam(1020,180,-20,420,'255,40,30',1.2,.55);
 const body=g=>{g.beginPath();g.ellipse(0,230,155,135,0,0,7);g.ellipse(0,95,118,100,0,0,7);g.ellipse(-80,20,34,70,-.35,0,7);g.ellipse(80,40,30,58,.4,0,7)};
 add(g=>{g.translate(520,560);g.rotate(-.62);body(g);g.fillStyle='rgba(255,160,80,1)';g.fill('nonzero');g.fillRect(-20,-525,40,560)},9,.9);
 layer(g=>{g.translate(520,560);g.rotate(-.62);body(g);const gr=g.createRadialGradient(-30,170,20,0,190,260);gr.addColorStop(0,'#3a0d08');gr.addColorStop(1,'#080303');g.fillStyle=gr;g.fill();
  g.fillStyle='#0b0706';g.fillRect(-14,-520,28,560);g.beginPath();g.moveTo(-22,-520);g.lineTo(30,-640);g.lineTo(42,-600);g.lineTo(18,-520);g.closePath();g.fill();
  g.fillStyle='#1d1a18';[[-40,140],[-40,200]].forEach(([a,b])=>g.fillRect(a,b,80,18));g.fillStyle='#2b2724';[[90,230],[120,265],[150,230]].forEach(([a,b])=>{g.beginPath();g.arc(a,b,12,0,7);g.fill()});
  g.strokeStyle='rgba(200,190,180,.5)';g.lineWidth=1.2;for(let k=-2;k<=3;k++){g.beginPath();g.moveTo(k*4.5,-515);g.lineTo(k*4.5,250);g.stroke()}},0,1);
  add(g=>{for(let i=0;i<160;i++){const px=R(0,1000),py=R(300,1000),l=R(6,20);g.strokeStyle=`rgba(255,${R(130,200)|0},60,${R(.4,1)})`;g.lineWidth=R(1,2.5);g.beginPath();g.moveTo(px,py);g.lineTo(px+R(-4,4),py-l);g.stroke()}},1.2,1);
 add(g=>{g.fillStyle='rgba(255,120,40,.15)';g.fillRect(0,900,1000,100)},20,1)}
};
window.render=n=>{x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.globalAlpha=1;S[n]();return true};
</script></body></html>
